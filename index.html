<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090910" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="{{SEO_DESCRIPTION}}" />
    <meta name="robots" content="{{SEO_ROBOTS}}" />
    <link rel="canonical" href="{{SEO_CANONICAL_URL}}" />
    <title>{{SEO_TITLE}}</title>

    <meta property="og:site_name" content="{{SEO_SITE_NAME}}" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="{{SEO_OG_LOCALE}}" />
    <meta property="og:title" content="{{SEO_TITLE}}" />
    <meta property="og:description" content="{{SEO_DESCRIPTION}}" />
    <meta property="og:url" content="{{SEO_CANONICAL_URL}}" />
    <meta property="og:image" content="{{SEO_IMAGE_URL}}" />
    <meta property="og:image:alt" content="{{SEO_IMAGE_ALT}}" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{SEO_TITLE}}" />
    <meta name="twitter:description" content="{{SEO_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{SEO_IMAGE_URL}}" />
    <meta name="twitter:image:alt" content="{{SEO_IMAGE_ALT}}" />

    <script type="application/ld+json">
      {{SEO_JSON_LD}}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
